# Локальное переопределение Sail: лёгкий PHP-образ вместо сборки runtimes/8.3
# и уже скачанный mysql:8.0 вместо mysql/mysql-server. Подхватывается автоматически.
services:
    laravel.test:
        build:
            context: ./docker
            dockerfile: Dockerfile.local
        image: schooll-chm/app
        user: '${WWWUSER:-1000}:${WWWGROUP:-1000}'
        environment:
            HOME: /tmp  # tinker/psysh и composer пишут конфиги в HOME
        command: ['php', 'artisan', 'serve', '--host=0.0.0.0', '--port=8000']
        ports: !override
            - '${APP_PORT:-8095}:8000'
        depends_on:
            mysql:
                condition: service_healthy
    mysql:
        image: 'mysql:8.0'
# Явная подсеть: стандартный пул Docker на этой машине исчерпан другими проектами
networks:
    sail:
        ipam:
            config:
                - subnet: 10.77.0.0/24
